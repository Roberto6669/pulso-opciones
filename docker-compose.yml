services:
  ts:
    image: tailscale/tailscale:latest
    hostname: opciones-w5
    environment:
      TS_AUTHKEY: ${TSAUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_HOSTNAME: opciones-w5
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  web:
    build: .
    network_mode: service:ts
    depends_on:
      - ts
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"

volumes:
  ts-state:
