<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulso Opciones · WEB5.0 v1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #121214;
      --raised: #1a1a1e;
      --fg: #f4f4f2;
      --muted: #9a9aa3;
      --subtle: #6e6e76;
      --line: rgba(244,244,242,.12);
      --accent: #d7dbe3;
      --up: #3fbf8f;
      --down: #e06868;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.5;
    }
    header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    header { padding: 20px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); max-width: none; }
    header .inner { max-width: 1100px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; }
    .logo { font-family: Newsreader, serif; font-size: 28px; }
    .tag { color: var(--subtle); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { font-family: Newsreader, serif; font-weight: 500; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -.03em; margin: 28px 0 8px; }
    .lead { color: var(--muted); max-width: 38rem; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin: 24px 0; }
    label { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--subtle); margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      font: inherit; cursor: pointer; border: 1px solid var(--line);
      background: transparent; color: var(--fg); border-radius: 999px;
      padding: 10px 14px; min-height: 44px;
    }
    button:hover { background: var(--raised); }
    button.active { background: var(--accent); color: #0a0a0b; border-color: transparent; }
    .row { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .row { grid-template-columns: 1fr 1fr; } }
    input[type="date"], input[type="text"], select {
      width: 100%; height: 44px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--fg); padding: 0 12px; font: inherit;
    }
    .time-row { display: flex; gap: 8px; align-items: end; }
    .time-row > div { flex: 1; }
    .scan { width: 100%; background: var(--accent); color: #0a0a0b; border: 0; border-radius: 8px; font-weight: 600; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--subtle); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 6px; }
    td { padding: 10px 6px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .mono { font-family: "IBM Plex Mono", monospace; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .empty { color: var(--muted); padding: 24px 0; }
    footer { color: var(--subtle); font-size: 12px; padding: 32px 20px; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <div><span class="logo">Pulso</span> <span class="tag">WEB5.0 · v1.0</span></div>
      <div class="tag" id="hoy"></div>
    </div>
  </header>
  <main>
    <h1>Escanea con tu dinero y tu fecha.</h1>
    <p class="lead">El contrato no puede costar más que tu presupuesto. El vencimiento se alinea al viernes que elijas.</p>

    <section class="panel">
      <label>Presupuesto (prima por contrato × 100, en dólares)</label>
      <div class="chips" id="budgets"></div>

      <div class="row" style="margin-top:20px">
        <div>
          <label>Símbolos (separados por coma)</label>
          <input id="syms" type="text" value="AAPL, NVDA, TSLA, AMD, META, MSFT" />
        </div>
        <div>
          <label>Lado</label>
          <select id="side">
            <option value="call">Calls</option>
            <option value="put">Puts</option>
            <option value="both">Ambos</option>
          </select>
        </div>
      </div>

      <div class="time-row" style="margin-top:20px">
        <div>
          <label>Vencimiento</label>
          <input id="exp" type="date" />
        </div>
        <button type="button" id="friday" style="border-radius:8px">Próximo viernes</button>
      </div>
      <p class="lead" id="expHint" style="margin:8px 0 0;font-size:13px"></p>

      <button class="scan" type="button" id="go">Escanear</button>
    </section>

    <section>
      <p class="lead" id="summary"></p>
      <div id="out" class="empty">Elige presupuesto y pulsa escanear.</div>
    </section>
  </main>
  <footer>WEB5.0 · v1.0 · No es consejo financiero. Las primas de muestra sirven para probar el filtro.</footer>

<script>
const APP = { line: "WEB5.0", version: "1.0" };
const BUDGETS = [25, 50, 100, 250, 500, 1000];
let budget = 100;

function nextFriday(from = new Date()) {
  const d = new Date(from);
  const dow = d.getDay();
  let add;
  if (dow === 5) {
    add = d.getHours() >= 16 ? 7 : 0;
  } else {
    add = (5 - dow + 7) % 7;
  }
  d.setDate(d.getDate() + add);
  d.setHours(0,0,0,0);
  return d;
}

function iso(d) {
  const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
}

function fmt(n) {
  return n.toLocaleString("es-US", { style: "currency", currency: "USD" });
}

function dte(exp) {
  const a = new Date(); a.setHours(0,0,0,0);
  const b = new Date(exp + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

const box = document.getElementById("budgets");
BUDGETS.forEach((n) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = fmt(n);
  b.dataset.n = n;
  if (n === budget) b.classList.add("active");
  b.onclick = () => {
    budget = n;
    [...box.children].forEach((c) => c.classList.toggle("active", Number(c.dataset.n) === n));
  };
  box.appendChild(b);
});

const exp = document.getElementById("exp");
function setFriday() {
  const f = nextFriday();
  exp.value = iso(f);
  const days = dte(exp.value);
  document.getElementById("expHint").textContent =
    days === 0
      ? "Hoy es viernes. Usamos el vencimiento de hoy."
      : `Próximo viernes: ${f.toLocaleDateString("es-US", { weekday: "long", day: "numeric", month: "long" })} · ${days} DTE`;
}
document.getElementById("friday").onclick = setFriday;
setFriday();
document.getElementById("hoy").textContent = new Date().toLocaleDateString("es-US", { weekday: "long", day: "numeric", month: "short" });

const SAMPLE = [
  { s:"AAPL", px:310.5, t:"call", k:315, bid:1.85, ask:2.05, oi:18420, vol:9320 },
  { s:"AAPL", px:310.5, t:"call", k:320, bid:0.92, ask:1.08, oi:22110, vol:15400 },
  { s:"AAPL", px:310.5, t:"put",  k:305, bid:1.70, ask:1.90, oi:9900, vol:4100 },
  { s:"NVDA", px:178.2, t:"call", k:180, bid:3.10, ask:3.35, oi:40120, vol:28000 },
  { s:"NVDA", px:178.2, t:"call", k:185, bid:1.45, ask:1.62, oi:33000, vol:19000 },
  { s:"NVDA", px:178.2, t:"put",  k:175, bid:2.20, ask:2.40, oi:21000, vol:12000 },
  { s:"TSLA", px:332.0, t:"call", k:340, bid:4.80, ask:5.10, oi:15000, vol:22000 },
  { s:"TSLA", px:332.0, t:"call", k:350, bid:2.35, ask:2.55, oi:18000, vol:16000 },
  { s:"TSLA", px:332.0, t:"put",  k:320, bid:3.40, ask:3.65, oi:11000, vol:8000 },
  { s:"AMD",  px:158.4, t:"call", k:160, bid:2.05, ask:2.20, oi:8700, vol:6400 },
  { s:"AMD",  px:158.4, t:"call", k:165, bid:0.88, ask:1.02, oi:7200, vol:5100 },
  { s:"META", px:528.0, t:"call", k:530, bid:6.10, ask:6.40, oi:5400, vol:3900 },
  { s:"META", px:528.0, t:"put",  k:520, bid:4.20, ask:4.50, oi:4100, vol:2500 },
  { s:"MSFT", px:428.0, t:"call", k:430, bid:3.55, ask:3.80, oi:9800, vol:6100 },
  { s:"MSFT", px:428.0, t:"put",  k:420, bid:2.10, ask:2.30, oi:6200, vol:2800 },
];

document.getElementById("go").onclick = () => {
  const symbols = document.getElementById("syms").value.toUpperCase().split(/[,\s]+/).filter(Boolean);
  const side = document.getElementById("side").value;
  const date = exp.value;
  const days = dte(date);
  const mid = (c) => (c.bid + c.ask) / 2;
  const debit = (c) => mid(c) * 100;

  const hits = SAMPLE
    .filter((c) => symbols.includes(c.s))
    .filter((c) => side === "both" || c.t === side)
    .filter((c) => debit(c) <= budget)
    .map((c) => ({ ...c, mid: mid(c), debit: debit(c), spread: c.ask - c.bid }))
    .sort((a, b) => a.debit - b.debit);

  document.getElementById("summary").textContent =
    `${hits.length} contratos ≤ ${fmt(budget)} · vencen ${date} (${days} DTE)`;

  if (!hits.length) {
    document.getElementById("out").innerHTML = `<p class="empty">Nada entra en ese presupuesto para esa fecha. Sube el presupuesto o cambia el lado.</p>`;
    return;
  }

  document.getElementById("out").innerHTML = `
    <div class="panel" style="padding:0; overflow:auto">
      <table>
        <thead><tr>
          <th>Símbolo</th><th>Lado</th><th>Strike</th><th>Prima</th><th>Costo</th><th>Spread</th><th>OI</th>
        </tr></thead>
        <tbody>
          ${hits.map((c) => `
            <tr>
              <td class="mono">${c.s}</td>
              <td class="${c.t === "call" ? "up" : "down"}">${c.t}</td>
              <td class="mono">${c.k}</td>
              <td class="mono">${c.mid.toFixed(2)}</td>
              <td class="mono">${fmt(c.debit)}</td>
              <td class="mono">${c.spread.toFixed(2)}</td>
              <td class="mono">${c.oi.toLocaleString("es-US")}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
};
</script>
</body>
</html>
